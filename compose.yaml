name: semaphore-flags

# Local development only. Credentials below are throwaway defaults, not secrets.
#   docker compose up --build --wait                 migrate + seed + api + db
#   docker compose --profile cache up --build --wait + redis (set API_REDIS_URL=redis://redis:6379)
#   docker compose --profile redis up --build --wait same as --profile cache
#   docker compose run --rm demo-client              one-shot evaluate walkthrough
#   docker compose --profile demo up --build         same client via the demo profile
#
# migrate and seed are one-shot. api runs `serve` only so a later restart with
# Postgres down still binds the port (/healthz 200, /readyz 503).

services:
  migrate:
    build: .
    image: semaphore-flags:local
    command: ["node", "dist/cli.js", "migrate"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-semaphore}:${POSTGRES_PASSWORD:-semaphore}@db:5432/${POSTGRES_DB:-semaphore}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    build: .
    image: semaphore-flags:local
    command: ["node", "dist/cli.js", "seed"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-semaphore}:${POSTGRES_PASSWORD:-semaphore}@db:5432/${POSTGRES_DB:-semaphore}
      SEED_KEYS_PATH: /shared/demo-keys.json
    volumes:
      - ./.demo-keys:/shared
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: .
    image: semaphore-flags:local
    command: ["node", "dist/cli.js", "serve"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-semaphore}:${POSTGRES_PASSWORD:-semaphore}@db:5432/${POSTGRES_DB:-semaphore}
      REDIS_URL: ${API_REDIS_URL:-}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
        required: false
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-semaphore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-semaphore}
      POSTGRES_DB: ${POSTGRES_DB:-semaphore}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["cache", "redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  demo-client:
    image: node:22-alpine
    profiles: ["demo"]
    working_dir: /demo
    command: ["node", "--experimental-strip-types", "--no-warnings", "demo-client.ts"]
    environment:
      SEMAPHORE_URL: http://api:8080
      SEMAPHORE_EVALUATE_KEY: ${DEMO_EVALUATE_KEY:-}
      SEED_KEYS_PATH: /shared/demo-keys.json
    volumes:
      - ./scripts/demo-client.ts:/demo/demo-client.ts:ro
      - ./scripts/demo-client.package.json:/demo/package.json:ro
      - ./.demo-keys:/shared:ro
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  db-data:
