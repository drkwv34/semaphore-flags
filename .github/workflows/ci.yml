name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: semaphore
          POSTGRES_PASSWORD: semaphore
          POSTGRES_DB: semaphore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U semaphore -d semaphore"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://semaphore:semaphore@localhost:5432/semaphore
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Contract tests
        run: pnpm test:contract
      - name: Integration tests
        run: pnpm test:integration
      - name: Build
        run: pnpm build
      - name: Dump Postgres logs
        if: failure()
        run: docker logs "$(docker ps -q --filter ancestor=postgres:16-alpine | head -n1)" || true

  image:
    name: compose config · image build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose
        run: |
          docker compose config --quiet
          docker compose --profile cache config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build api image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: semaphore-flags:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Dump compose / docker on failure
        if: failure()
        run: |
          docker compose logs || true
          docker ps -a || true
